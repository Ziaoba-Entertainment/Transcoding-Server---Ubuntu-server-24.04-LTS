server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/mediaserver_access.log;
    error_log /var/log/nginx/mediaserver_error.log;

    client_max_body_size 20G;
    gzip off;

    # 1. HLS VOD Delivery
    location /hls/ {
        alias /srv/vod/hls/;
        sendfile on;
        tcp_nopush on;
        autoindex off;

        # MIME types
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # CORS
        add_header Access-Control-Allow-Origin *;

        # Cache-Control
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin *;
        }
        location ~* \.ts$ {
            add_header Cache-Control "max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        try_files $uri $uri/ =404;
    }

    # 6. Ads VOD Delivery
    location /ads/ {
        alias /srv/vod/ads/;
        sendfile on;
        tcp_nopush on;
        autoindex off;

        # MIME types
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # CORS
        add_header Access-Control-Allow-Origin *;

        # Cache-Control
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin *;
        }
        location ~* \.ts$ {
            add_header Cache-Control "max-age=3600";
            add_header Access-Control-Allow-Origin *;
        }

        try_files $uri $uri/ =404;
    }

    # 2. Radarr Reverse Proxy
    location /radarr {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:7878;
    }

    # 3. Sonarr Reverse Proxy
    location /sonarr {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:8989;
    }

    # 4. Prowlarr Reverse Proxy
    location /prowlarr {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:9696;
    }

    # 5. Transcoder Web UI Proxy
    location /transcoder/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:6666/;
        
        # SSE Support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        keepalive_timeout 65;
    }

    # 7. Ad Server Stitching Proxy
    location /stream/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:8082/;
    }

    # 8. Ad Server Admin Proxy
    location /admin/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:88/;
    }

    location /transcoder {
        return 301 $scheme://$http_host$uri/;
    }

    # Redirect root to transcoder
    location = / {
        return 301 /transcoder/;
    }
}
